# docker-compose.yml — cliptunnel-mcp repeater + Caddy (automatic HTTPS).
#
# Usage:
#   1. Edit Caddyfile: replace `repeater.example.com` with your domain.
#   2. Set REPEATER_TOKENS in .env (see .env.example).
#   3. Run: docker compose up -d
#
# The repeater is a zero-knowledge relay: it authenticates peers via bearer
# tokens but cannot decrypt content (AES is end-to-end between Controller
# and Agent). The repeater never sees plaintext.

services:
  repeater:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      - REPEATER_TOKENS=${REPEATER_TOKENS}
      - REPEATER_HOST=0.0.0.0
      - REPEATER_PORT=8443
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8443/slot', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - repeater
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: