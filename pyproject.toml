[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cliptunnel-mcp"
version = "0.9.0"
description = "Operate locked-down remote machines through their clipboard, an HTTPS repeater, or Firebase"
authors = [
    { name = "Jordi Murgó", email = "jordi.murgo@gmail.com" },
]
maintainers = [
    { name = "Jordi Murgó", email = "jordi.murgo@gmail.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "clipboard", "tunnel", "remote", "agent", "controller", "citrix", "vdi", "repeater", "dlp", "firebase"]
requires-python = ">=3.10"
dependencies = [
    "clipboard-event>=0.2.0",
    "cryptography>=42",
    "websockets>=12.0",
    'tomli>=1.1.0; python_version < "3.11"',
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.scripts]
cliptunnel-mcp = "cliptunnel_mcp.server:main"
cliptunnel-agent = "cliptunnel_mcp.agent:main"

[project.optional-dependencies]
server = ["mcp>=1.2,<2"]

[project.urls]
Homepage = "https://github.com/jordi-murgo/cliptunnel-mcp"
Repository = "https://github.com/jordi-murgo/cliptunnel-mcp.git"
Issues = "https://github.com/jordi-murgo/cliptunnel-mcp/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cliptunnel_mcp = ["py.typed"]